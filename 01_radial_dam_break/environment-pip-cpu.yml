name: pdebench-swe-pip-cpu
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip>=24
  - numpy=1.26
  - scipy=1.15
  - h5py=3.13
  - matplotlib-base=3.10
  - pillow=10.4
  - imageio>=2.36
  - tqdm
  - hydra-core=1.3
  - python-dotenv
  - pyyaml>=6
  - clawpack=5.9
  - hatchling
  - hatch-vcs
  - pip:
      - --index-url https://download.pytorch.org/whl/cpu
      - torch==2.5.1
